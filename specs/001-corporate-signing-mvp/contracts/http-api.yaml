        "required": [
          "schema",
          "tenant_id",
          "seq",
          "type",
          "actor",
          "server_time",
          "envelope_id",
          "subject_digest",
          "metadata",
          "prev_digest",
          "event_digest"
        ]
      },
      "AuditReceipt": {
        "type": "object",
        "additionalProperties": false,
        "description": "audit-receipt.json: every event of this envelope from the tenant's hash chain, each with its full digest preimage (AuditEventRecord), plus the chain head at completion and the latest checkpoint. A holder can recompute every event_digest. prev_digest links to the tenant chain, whose events for other envelopes are omitted for confidentiality, so continuity is checkable only between consecutive seq values in the receipt; full-chain continuity is attested by chain_head_digest and the checkpoint and verified on restore. Tamper-evident, not tamper-proof.",
        "properties": {
          "schema": {
            "const": "opensig.audit-receipt/1"
          },
          "envelope_id": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_-]{16,64}$"
          },
          "events": {
            "type": "array",
            "minItems": 1,
            "items": {
              "$ref": "#/components/schemas/AuditEventRecord"
            }
          },
          "chain_head_digest": {
            "type": "string",
            "pattern": "^[0-9a-f]{64}$",
            "description": "Lowercase hex SHA-256 over exact bytes"
          },
          "checkpoint": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "seq": {
                "type": "integer",
                "minimum": 1
              },
              "digest": {
                "type": "string",
                "pattern": "^[0-9a-f]{64}$",
                "description": "Lowercase hex SHA-256 over exact bytes"
              },
              "created_at": {
                "type": "string",
                "format": "date-time",
                "description": "Server UTC time; unsigned server time, never a trusted timestamp"
              }
            },
            "required": [
              "seq",
              "digest",
              "created_at"
            ]
          }
        },
        "required": [
          "schema",
          "envelope_id",
          "events",
          "chain_head_digest",
          "checkpoint"
        ]
      },
      "PackageIndex": {
        "type": "object",
        "additionalProperties": false,
        "description": "package-index.json. The ZIP holds exactly final.pdf, approval-manifest.json, audit-receipt.json, verification.json and package-index.json (store method, fixed timestamps, deterministic order).",
        "properties": {
          "schema": {
            "const": "opensig.package-index/1"
          },
          "envelope_id": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_-]{16,64}$"
          },
          "artifact_id": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_-]{16,64}$"
          },
          "files": {
            "type": "array",
            "minItems": 4,
            "maxItems": 4,
            "items": {
              "type": "object",
              "additionalProperties": false,
              "properties": {
                "path": {
                  "enum": [
                    "final.pdf",
                    "approval-manifest.json",
                    "audit-receipt.json",
                    "verification.json"
                  ]
                },
                "sha256": {
                  "type": "string",
                  "pattern": "^[0-9a-f]{64}$",
                  "description": "Lowercase hex SHA-256 over exact bytes"
                },
                "bytes": {
                  "type": "integer",
                  "minimum": 1
                }
              },
              "required": [
                "path",
                "sha256",
                "bytes"
              ]
            }
          }
        },
        "required": [
          "schema",
          "envelope_id",
          "artifact_id",
          "files"
        ]
      },
      "WebhookRegistrationCreate": {
        "type": "object",
        "additionalProperties": false,
        "description": "HTTPS only; destination must match the tenant allowlist; private, loopback, link-local, metadata and IPv4-mapped/alternate-form addresses are rejected at registration and again at every connection (resolve once, validate every A/AAAA record, connect to that address, no redirects, proxy env ignored).",
        "properties": {
          "url": {
            "type": "string",
            "format": "uri",
            "pattern": "^https://",
            "maxLength": 2048
          },
          "event_types": {
            "type": "array",
            "minItems": 1,
            "uniqueItems": true,
            "items": {
              "$ref": "#/components/schemas/WebhookEventType"
            }
          },
          "description": {
            "type": "string",
            "maxLength": 200
          }
        },
        "required": [
          "url",
          "event_types"
        ]
      },
      "WebhookEventType": {
        "enum": [
          "envelope.sent",
          "envelope.completed",
          "envelope.declined",
          "envelope.expired",
          "envelope.voided",
          "envelope.finalization_failed"
        ]
      },
      "WebhookKeyIssued": {
        "type": "object",
        "additionalProperties": false,
        "description": "The secret is shown exactly once in this response and stored server-side only protected at rest.",
        "properties": {
          "key_id": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_-]{16,64}$"
          },
          "secret": {
            "type": "string",
            "minLength": 43,
            "maxLength": 128
          },
          "created_at": {
            "type": "string",
            "format": "date-time",
            "description": "Server UTC time; unsigned server time, never a trusted timestamp"
          },
          "previous_key_id": {
            "oneOf": [
              {
                "type": "string",
                "pattern": "^[A-Za-z0-9_-]{16,64}$"
              },
              {
                "type": "null"
              }
            ]
          },
          "previous_key_expires_at": {
            "oneOf": [
              {
                "type": "string",
                "format": "date-time",
                "description": "Server UTC time; unsigned server time, never a trusted timestamp"
              },
              {
                "type": "null"
              }
            ]
          }
        },
        "required": [
          "key_id",
          "secret",
          "created_at",
          "previous_key_id",
          "previous_key_expires_at"
        ]
      },
      "WebhookRegistration": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_-]{16,64}$"
          },
          "url": {
            "type": "string",
            "format": "uri"
          },
          "event_types": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/WebhookEventType"
            }
          },
          "status": {
            "enum": [
              "active",
              "disabled"
            ]
          },
          "active_key_ids": {
            "type": "array",
            "minItems": 0,
            "maxItems": 2,
            "items": {
              "type": "string",
              "pattern": "^[A-Za-z0-9_-]{16,64}$"
            }
          },
          "created_at": {
            "type": "string",
            "format": "date-time",
            "description": "Server UTC time; unsigned server time, never a trusted timestamp"
          }
        },
        "required": [
          "id",
          "url",
          "event_types",
          "status",
          "active_key_ids",
          "created_at"
        ]
      },
      "WebhookRegistrationCreated": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "registration": {
            "$ref": "#/components/schemas/WebhookRegistration"
          },
          "signing_key": {
            "$ref": "#/components/schemas/WebhookKeyIssued"
          }
        },
        "required": [
          "registration",
          "signing_key"
        ]
      },
      "WebhookKeyRotate": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "overlap_seconds": {
            "type": "integer",
            "minimum": 0,
            "maximum": 86400
          }
        },
        "required": [
          "overlap_seconds"
        ]
      },
      "WebhookEvent": {
        "type": "object",
        "additionalProperties": false,
        "description": "Carries no PDF, names, contact details or tokens. Consumers fetch canonical status with their own credential before acting. event_id is stable across delivery retries.",
        "properties": {
          "event_id": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_-]{16,64}$"
          },
          "schema_version": {
            "const": "1"
          },
          "type": {
            "$ref": "#/components/schemas/WebhookEventType"
          },
          "envelope_id": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_-]{16,64}$"
          },
          "envelope_version": {
            "type": "integer",
            "minimum": 1
          },
          "artifact_id": {
            "oneOf": [
              {
                "type": "string",
                "pattern": "^[A-Za-z0-9_-]{16,64}$"
              },
              {
                "type": "null"
              }
            ]
          },
          "artifact_digest": {
            "oneOf": [
              {
                "type": "string",
                "pattern": "^[0-9a-f]{64}$",
                "description": "Lowercase hex SHA-256 over exact bytes"
              },
              {
                "type": "null"
              }
            ]
          },
          "occurred_at": {
            "type": "string",
            "format": "date-time",
            "description": "Server UTC time; unsigned server time, never a trusted timestamp"
          }
        },
        "required": [
          "event_id",
          "schema_version",
          "type",
          "envelope_id",
          "envelope_version",
          "artifact_id",
          "artifact_digest",
          "occurred_at"
        ]
      }
    },
    "responses": {
      "BadRequest": {
        "description": "invalid_request: malformed JSON, schema violation or unknown property",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "Unauthorized": {
        "description": "unauthenticated: missing, expired or wrong-scheme credential (an operator bearer on a recipient route is 401)",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "Forbidden": {
        "description": "forbidden / csrf_failed / origin_rejected: authenticated but role, scope, principal kind, CSRF token or origin not allowed",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "NotFound": {
        "description": "not_found: absent or inaccessible; identical for other tenants' resources",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "Conflict": {
        "description": "version_conflict, state_conflict, order_conflict, idempotency_conflict, confirmation_required, confirmation_invalid, digest_mismatch, consent_mismatch, not_completed or finalization_not_retryable",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "PayloadTooLarge": {
        "description": "payload_too_large: request body over the route limit (10 MiB for PDF upload, enforced while streaming; 256 KiB for JSON)",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "UnsupportedMediaType": {
        "description": "unsupported_media_type",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "Unprocessable": {
        "description": "unsupported_pdf (malformed, encrypted, already signed, over 50 pages, unsupported features), field_out_of_bounds, unsupported_characters or destination_not_allowed",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "PreconditionRequired": {
        "description": "precondition_required: If-Match missing on upload",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "TooManyRequests": {
        "description": "rate_limited or locked",
        "headers": {
          "Retry-After": {
            "schema": {
              "type": "integer",
              "minimum": 1
            }
          }
        },
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      }
    },
    "parameters": {
      "EnvelopeId": {
        "name": "envelope_id",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "pattern": "^[A-Za-z0-9_-]{16,64}$"
        }
      },
      "RecipientId": {
        "name": "recipient_id",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "pattern": "^[A-Za-z0-9_-]{16,64}$"
        }
      },
      "RegistrationId": {
        "name": "registration_id",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "pattern": "^[A-Za-z0-9_-]{16,64}$"
        }
      },
      "KeyId": {
        "name": "key_id",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "pattern": "^[A-Za-z0-9_-]{16,64}$"
        }
      },
      "IdempotencyKey": {
        "name": "Idempotency-Key",
        "in": "header",
        "required": true,
        "description": "Scoped by tenant, route and principal. Same key and same payload returns the original result; a changed payload is 409 idempotency_conflict.",
        "schema": {
          "type": "string",
          "pattern": "^[A-Za-z0-9_-]{16,128}$"
        }
      },
      "CsrfToken": {
        "name": "X-CSRF-Token",
        "in": "header",
        "required": true,
        "description": "Value from RecipientSessionState.csrf_token or the session-create response; bound to the session server-side. Origin must also match the deployment allowlist.",
        "schema": {
          "type": "string",
          "minLength": 43,
          "maxLength": 128
        }
      },
      "IfMatch": {
        "name": "If-Match",
        "in": "header",
        "required": true,
        "description": "Expected envelope version as a quoted string, e.g. \"1\"",
        "schema": {
          "type": "string",
          "pattern": "^\"[1-9][0-9]{0,9}\"$"
        }
      }
    },
    "securitySchemes": {
      "operatorOAuth": {
        "type": "oauth2",
        "description": "OIDC access token validated against the configured issuer, audience and JWKS (configuration only; no discovery fetch at runtime). Allowed algorithms are pinned (RS256, ES256); clock skew at most 60 seconds. Scopes below; roles come from configured tenant-role claim mapping.",
        "flows": {
          "authorizationCode": {
            "authorizationUrl": "https://issuer.invalid/authorize",
            "tokenUrl": "https://issuer.invalid/token",
            "scopes": {
              "envelopes:read": "read envelopes and previews",
              "envelopes:write": "create, upload, prepare, reissue",
              "envelopes:send": "send and resend invitations",
              "envelopes:confirm-send": "human confirmation of a recipient preview",
              "envelopes:void": "void before finalization",
              "finalization:retry": "retry failed finalization",
              "artifacts:read": "read verification, final PDF and package",
              "webhooks:admin": "manage webhook registrations and keys"
            }
          },
          "clientCredentials": {
            "tokenUrl": "https://issuer.invalid/token",
            "scopes": {
              "envelopes:read": "read envelopes and previews",
              "envelopes:write": "create, upload, prepare",
              "envelopes:send": "send with a human authorization_reference",
              "artifacts:read": "read verification, final PDF and package"
            }
          }
        }
      },
      "recipientSession": {
        "type": "apiKey",
        "in": "cookie",
        "name": "__Host-opensig_rs",
        "description": "Opaque session value (stored hashed) bound to tenant, envelope, recipient, revision and manifest; HttpOnly, Secure, SameSite=Strict; 30-minute idle expiry; revoked by resend, reissue, void, decline or expiry. Mutations also require X-CSRF-Token and an allowlisted Origin."
      }
    }
  }
}
