{
  "openapi": "3.1.0",
  "info": {
    "title": "openSig Corporate Signing MVP",
    "version": "0.1.0-draft",
    "license": {
      "name": "Apache-2.0",
      "identifier": "Apache-2.0"
    },
    "description": "Proposed contract; tenant comes from verified identity, never request body. Operator scopes distinguish service preparation from human approval. No deployed endpoint is claimed."
  },
  "paths": {
    "/v1/envelopes": {
      "post": {
        "operationId": "createEnvelope",
        "security": [
          {
            "operator": []
          }
        ],
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 1
            }
          }
        ],
        "responses": {
          "201": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Envelope"
                }
              }
            }
          },
          "400": {
            "description": "Invalid input"
          },
          "401": {
            "description": "Authentication required"
          },
          "404": {
            "description": "Absent or inaccessible; no cross-tenant disclosure"
          },
          "409": {
            "description": "Version, state, order or idempotency payload conflict"
          },
          "413": {
            "description": "Input size exceeded"
          },
          "422": {
            "description": "Unsupported PDF or fields"
          },
          "429": {
            "description": "Rate/attempt limit"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/EnvelopeCreate"
              }
            }
          }
        }
      }
    },
