  "webhooks": {
    "envelopeEvent": {
      "post": {
        "operationId": "deliverEnvelopeEvent",
        "summary": "Signed, replay-safe callback to a registered HTTPS destination",
        "description": "HMAC-SHA256 over '<timestamp>.<raw body>' with the registration key named by X-OpenSig-Key-Id. Consumers reject timestamps older than 5 minutes, deduplicate event_id for at least the 72-hour maximum retry horizon, and fetch canonical status with their own credential before acting.",
        "parameters": [
          {
            "name": "X-OpenSig-Signature",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^v1=[0-9a-f]{64}$"
            }
          },
          {
            "name": "X-OpenSig-Timestamp",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[0-9]{10}$"
            }
          },
          {
            "name": "X-OpenSig-Key-Id",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9_-]{16,64}$"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/WebhookEvent"
              }
            }
          }
        },
        "responses": {
          "2XX": {
            "description": "Acknowledged; any other status or a timeout schedules a bounded retry with the same event_id"
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "Error": {
        "type": "object",
        "additionalProperties": false,
        "description": "Every 4xx/5xx body. Messages are generic; no token, cookie, code, key, PDF content or other-tenant fact appears.",
