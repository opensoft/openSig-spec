  "components": {
    "schemas": {
      "EnvelopeCreate": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "source_app": {
            "enum": [
              "hermes",
              "openchart",
              "openpractice",
              "manual"
            ]
          },
          "source_record": {
            "type": "string",
            "minLength": 1
          },
          "source_version": {
            "type": "string",
            "minLength": 1
          },
          "recipients": {
            "type": "array",
            "minItems": 1,
            "maxItems": 2,
            "items": {
              "$ref": "#/components/schemas/Recipient"
            }
          }
        },
        "required": [
          "source_app",
          "source_record",
          "source_version",
          "recipients"
        ]
      },
      "Recipient": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "email": {
            "type": "string",
            "format": "email"
          },
          "role": {
            "type": "string",
            "minLength": 1
          },
          "ordinal": {
            "type": "integer",
            "minimum": 1,
            "maximum": 2
          }
        },
        "required": [
          "email",
          "role",
          "ordinal"
        ]
      },
      "Envelope": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "minLength": 1
          },
          "version": {
            "type": "integer",
            "minimum": 1
          },
          "state": {
            "enum": [
              "draft",
              "prepared",
              "sent",
              "in-progress",
              "finalizing",
              "completed",
              "declined",
              "expired",
              "voided"
            ]
          },
          "document_digest": {
            "type": "string",
            "minLength": 1
          },
          "manifest_digest": {
            "type": "string",
            "minLength": 1
          },
          "job_status": {
            "enum": [
              "pending",
              "running",
              "retryable",
              "failed",
              "succeeded"
            ]
          },
          "anchor_status": {
            "enum": [
              "disabled",
              "fake"
            ]
          }
        },
        "required": [
          "id",
          "version",
          "state",
          "anchor_status"
        ]
      },
      "Field": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "recipient_id": {
            "type": "string",
            "minLength": 1
          },
          "page": {
            "type": "integer",
            "minimum": 1,
            "maximum": 50
          },
          "type": {
            "enum": [
              "signature",
              "date"
            ]
          },
          "rectangle": {
            "type": "array",
            "minItems": 4,
            "maxItems": 4,
            "items": {
              "type": "number",
              "minimum": 0,
              "maximum": 1
            }
          }
        },
        "required": [
          "recipient_id",
          "page",
          "type",
          "rectangle"
        ]
      },
      "Prepare": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "expected_version": {
            "type": "integer"
          },
          "fields": {
            "type": "array",
            "minItems": 1,
            "maxItems": 20,
            "items": {
              "$ref": "#/components/schemas/Field"
            }
          }
        },
        "required": [
          "expected_version",
          "fields"
        ]
      },
      "Approval": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "expected_version": {
            "type": "integer"
          },
          "document_digest": {
            "type": "string",
            "minLength": 1
          },
          "manifest_digest": {
            "type": "string",
            "minLength": 1
          },
          "prior_approval_digest": {
            "type": [
              "string",
              "null"
            ]
          },
          "consent_version": {
            "type": "string",
            "minLength": 1
          },
          "consent": {
            "const": true
          },
          "field_values": {
            "type": "object",
            "additionalProperties": {
              "type": "string",
              "maxLength": 100000
            }
          }
        },
        "required": [
          "expected_version",
          "document_digest",
          "manifest_digest",
          "prior_approval_digest",
          "consent_version",
          "consent",
          "field_values"
        ]
      },
      "Error": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "code": {
            "type": "string",
            "minLength": 1
          },
          "correlation_id": {
            "type": "string",
            "minLength": 1
          }
        },
        "required": [
          "code",
          "correlation_id"
        ]
      },
      "Verification": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "artifact_digest": {
            "type": "string",
            "minLength": 1
          },
          "integrity": {
            "enum": [
              "valid",
              "invalid",
              "indeterminate"
            ]
          },
          "trust": {
            "enum": [
              "trusted",
              "untrusted",
              "indeterminate"
            ]
          },
          "revision_coverage": {
            "enum": [
              "complete",
              "incomplete",
              "indeterminate"
            ]
          },
          "seal_type": {
            "const": "organization"
          },
          "timestamp_status": {
            "enum": [
              "trusted",
              "absent",
              "invalid",
              "indeterminate"
            ]
          },
          "revocation_status": {
            "enum": [
              "good",
              "revoked",
              "unknown",
              "not-checked"
            ]
          },
          "verifier_version": {
            "type": "string",
            "minLength": 1
          }
        },
        "required": [
          "artifact_digest",
          "integrity",
          "trust",
          "revision_coverage",
          "seal_type",
          "timestamp_status",
          "revocation_status",
          "verifier_version"
        ]
      }
    },
    "securitySchemes": {
      "operator": {
        "type": "http",
        "scheme": "bearer",
        "description": "OIDC issuer/audience/tenant-role verified; service identities never approve"
      },
      "recipient": {
        "type": "apiKey",
        "in": "cookie",
        "name": "opensig_session",
        "description": "Short-lived HttpOnly/Secure session after bound invite and mailbox challenge; CSRF required"
      }
    }
  }
}
