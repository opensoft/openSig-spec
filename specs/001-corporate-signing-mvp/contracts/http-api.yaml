{
  "openapi": "3.1.0",
  "info": {
    "title": "openSig Corporate Signing MVP",
    "version": "0.2.1-draft",
    "license": {
      "name": "Apache-2.0",
      "identifier": "Apache-2.0"
    },
    "description": "Proposed contract (draft 0.2, 2026-11-08); no deployed endpoint is claimed. Tenant comes from the verified principal, never from a body or path. Operator principals are classified by configured claim mapping as human-operator (roles sender, tenant_admin) or service (role service; e.g. Hermes, openChart, openPractice). No operator browser session exists in the MVP: operator clients send bearer tokens; JWKS come from configuration only; algorithms, issuer, audience and clock skew are pinned. Recipients use a separate cookie scheme after invitation plus mailbox challenge. No capability value (invitation, code, session, CSRF token) ever appears in a URL path, query, redirect, Referer or log; the invitation is carried in the mailed link's URL fragment. Cross-tenant absence and inaccessibility are both 404. Every 4xx body is Error. The role-by-operation matrix is x-opensig-role-matrix; the Hermes tool mapping is x-opensig-hermes-tools."
  },
  "servers": [
    {
      "url": "http://127.0.0.1:8443",
      "description": "Local synthetic development only (loopback bind)"
    }
  ],
