    {
      "name": "webhooks"
    }
  ],
  "x-opensig-role-definitions": {
    "sender": "human operator who prepares and sends envelopes",
    "tenant_admin": "human operator who administers webhooks and finalization retries",
    "service": "non-human principal (Hermes, healthcare adapters); can never confirm sends, approve, register callbacks or void",
    "recipient": "bound recipient session (cookie); the only principal that can approve or decline",
    "anonymous": "unauthenticated; static shell and challenge/session creation only"
  },
